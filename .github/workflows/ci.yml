name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript (web, packages, content)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build shared packages
        run: pnpm --filter "./packages/*" run build
      - run: pnpm format:check
      - name: Content is valid and the app's copy is in sync
        run: pnpm content:validate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build web
        run: pnpm --filter @mirthmix/web run build
      - name: Install Playwright browser
        run: pnpm --filter @mirthmix/web exec playwright install --with-deps chromium
      - name: Web end-to-end and accessibility tests
        run: pnpm --filter @mirthmix/web run test:e2e
      - name: Dependency audit (high and critical)
        run: pnpm audit --prod --audit-level high

  flutter:
    name: Flutter (mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format check
        run: dart format --output=none --set-exit-if-changed $(find lib test -name '*.dart' ! -name '*.g.dart' ! -name 'app_localizations*')
      - run: flutter analyze
      # Includes the shared engine test vectors in packages/game-engine/test-vectors.
      - run: flutter test
      # GitHub's Ubuntu runners include the Android SDK; this verifies the Android release build compiles.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build Android release APK (debug-signed unless a keystore is configured)
        run: flutter build apk --release --split-per-abi
      - name: Report APK sizes
        run: ls -la build/app/outputs/flutter-apk/*.apk
